name: Build Master Teams

on:
  workflow_dispatch: # Allows manual trigger from the GitHub UI

permissions:
  contents: write

jobs:
  build-teams:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Build Script
        run: |
          python build_master_teams.py

      - name: Commit and Push master_teams.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add master_teams.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-generate master_teams.json" && git push)
