name: Daily OMHA Simulation Pipeline

on:
  schedule:
    # Runs daily at 09:00 UTC (4:00 AM EST), after late night GameSheet reports are posted
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-daily-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install requests icalendar

      # 1. Fetch live team calendars & remaining games
      - name: Fetch Live Schedules
        run: python fetch_team_schedules.py

      # 2. Ingest GameSheet completed scores & standings
      - name: Ingest GameSheet Data
        env:
          GAMESHEET_FIREBASE_KEY: ${{ secrets.GAMESHEET_FIREBASE_KEY }}
          GAMESHEET_EMAIL: ${{ secrets.GAMESHEET_EMAIL }}
          GAMESHEET_PASSWORD: ${{ secrets.GAMESHEET_PASSWORD }}
          GAMESHEET_AUTH: ${{ secrets.GAMESHEET_AUTH }}
          PYTHONUNBUFFERED: '1'
        run: python fetch_omha_data.py

      # 3. Run Monte Carlo Simulation & Tiebreaker Engine
      - name: Run Season Simulation Engine
        run: python simulate_season.py

      # 4. Commit all data artifacts and fresh simulation results in one clean push
      - name: Commit and Push Daily Updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add omha_raw_data.json full_season_games.json future_games.json simulation_results.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated daily simulation update [skip ci]" && git push)
