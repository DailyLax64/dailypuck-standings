name: Inspect GameSheet Data

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Prototype Team Calendar Scraper
        run: |
          cat << 'EOF' > parse_team_calendar.py
          import urllib.request
          import re
          from datetime import datetime

          ics_url = "https://burlingtoneagles.com/webcal.ashx?IDs=2074"
          headers = {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36'
          }

          print("=" * 70)
          print("FETCHING BURLINGTON EAGLES U11 AA LEAGUE CALENDAR")
          print("=" * 70)

          req = urllib.request.Request(ics_url, headers=headers)
          try:
              with urllib.request.urlopen(req, timeout=15) as resp:
                  content = resp.read().decode('utf-8', errors='ignore')
          except Exception as e:
              print(f"Error fetching ICS: {e}")
              exit(1)

          # Parse VEVENT blocks
          events = []
          curr = None
          for raw_line in content.splitlines():
              line = raw_line.strip()
              if line == "BEGIN:VEVENT":
                  curr = {}
              elif line == "END:VEVENT":
                  if curr:
                      events.append(curr)
                  curr = None
              elif curr is not None and ":" in line:
                  k_part, v = line.split(":", 1)
                  k = k_part.split(";")[0].upper()
                  curr[k] = v.replace("\\n", " ").replace("\\,", ",")

          league_games = []

          def parse_dt(dt_str):
              clean = re.sub(r'[^0-9T]', '', dt_str or "")
              date_part, time_part = "", ""
              if "T" in clean:
                  d, t = clean.split("T", 1)
                  if len(d) == 8:
                      date_part = f"{d[0:4]}-{d[4:6]}-{d[6:8]}"
                  if len(t) >= 4:
                      time_part = f"{t[0:2]}:{t[2:4]}"
              elif len(clean) == 8:
                  date_part = f"{clean[0:4]}-{clean[4:6]}-{clean[6:8]}"
              return date_part, time_part

          for ev in events:
              summary = ev.get("SUMMARY", "").strip()
              description = ev.get("DESCRIPTION", "").strip()
              location = ev.get("LOCATION", "").strip()
              dtstart = ev.get("DTSTART", "").strip()

              # Search summary or description for league game code: [XXX]
              full_text = f"{summary} {description}"
              match = re.search(r'(?:vs\.?|@)\s+(.*?)\s*\[(.*?)\]', full_text, re.IGNORECASE)

              if match:
                  opp = match.group(1).strip()
                  game_code = match.group(2).strip()

                  # Home vs Away detection
                  is_away = "@" in summary.split("[")[0] if "[" in summary else "@" in summary
                  game_type = "Away" if is_away else "Home"

                  date_val, time_val = parse_dt(dtstart)

                  league_games.append({
                      "game_code": game_code,
                      "date": date_val,
                      "time": time_val,
                      "type": game_type,
                      "opponent": opp,
                      "location": location,
                      "summary": summary
                  })

          league_games.sort(key=lambda x: (x["date"], x["time"]))

          print(f"Total Calendar Entries: {len(events)}")
          print(f"Official League Games Identified: {len(league_games)}\n")

          if league_games:
              print(f"📅 Schedule Coverage:")
              print(f"   Earliest Game: {league_games[0]['date']}")
              print(f"   Latest Game:   {league_games[-1]['date']}\n")

              print("=" * 80)
              print(f"{'Date':<11} | {'Time':<5} | {'Type':<5} | {'Code':<12} | {'Opponent':<24} | {'Location'}")
              print("-" * 80)
              for g in league_games:
                  print(f"{g['date']:<11} | {g['time']:<5} | {g['type']:<5} | {g['game_code']:<12} | {g['opponent'][:22]:<24} | {g['location'][:25]}")
              print("=" * 80)

          EOF
          python parse_team_calendar.py
