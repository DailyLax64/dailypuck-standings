name: Inspect GameSheet Data

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Test Multi-League Calendar Parser
        run: |
          cat << 'EOF' > test_all_leagues.py
          import urllib.request
          import re
          from datetime import datetime

          feeds = [
              {
                  "league": "Tri-County",
                  "team": "Burlington Eagles",
                  "url": "https://burlingtoneagles.com/webcal.ashx?IDs=2074"
              },
              {
                  "league": "York-Simcoe",
                  "team": "South Simcoe Storm",
                  "url": "https://southsimcoeminorhockey.ca/webcal.ashx?IDs=1152"
              },
              {
                  "league": "Lakeshore",
                  "team": "Peterborough Petes",
                  "url": "https://peterboroughhockey.com/webcal.ashx?IDs=3495"
              }
          ]

          headers = {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36'
          }

          def parse_dt(dt_str):
              clean = re.sub(r'[^0-9T]', '', dt_str or "")
              date_part, time_part = "", ""
              if "T" in clean:
                  d, t = clean.split("T", 1)
                  if len(d) == 8:
                      date_part = f"{d[0:4]}-{d[4:6]}-{d[6:8]}"
                  if len(t) >= 4:
                      time_part = f"{t[0:2]}:{t[2:4]}"
              elif len(clean) == 8:
                  date_part = f"{clean[0:4]}-{clean[4:6]}-{clean[6:8]}"
              return date_part, time_part

          for item in feeds:
              league = item["league"]
              team = item["team"]
              url = item["url"]

              print("\n" + "=" * 80)
              print(f"[{league.upper()}] - {team.upper()}")
              print(f"URL: {url}")
              print("=" * 80)

              req = urllib.request.Request(url, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=15) as resp:
                      content = resp.read().decode('utf-8', errors='ignore')
              except Exception as e:
                  print(f"Error fetching ICS: {e}")
                  continue

              events = []
              curr = None
              for raw_line in content.splitlines():
                  line = raw_line.strip()
                  if line == "BEGIN:VEVENT":
                      curr = {}
                  elif line == "END:VEVENT":
                      if curr:
                          events.append(curr)
                      curr = None
                  elif curr is not None and ":" in line:
                      k_part, v = line.split(":", 1)
                      k = k_part.split(";")[0].upper()
                      curr[k] = v.replace("\\n", " ").replace("\\,", ",")

              print(f"Total Calendar Entries Found: {len(events)}")

              games = []
              bracket_codes = set()

              for ev in events:
                  summary = ev.get("SUMMARY", "").strip()
                  description = ev.get("DESCRIPTION", "").strip()
                  location = ev.get("LOCATION", "").strip()
                  dtstart = ev.get("DTSTART", "").strip()
                  full_text = f"{summary} {description}"

                  # Check if event represents a matchup
                  if not re.search(r'\b(vs\.?|@)\b', summary, re.IGNORECASE):
                      continue

                  # Extract bracket code if present
                  code_match = re.search(r'\[(.*?)\]', full_text)
                  code = code_match.group(1).strip() if code_match else "NO_CODE"
                  if code != "NO_CODE":
                      bracket_codes.add(code)

                  is_away = "@" in summary
                  game_type = "Away" if is_away else "Home"

                  # Extract opponent name
                  opp_match = re.search(r'(?:vs\.?|@)\s+(.*?)(?:\s*\[|$)', summary, re.IGNORECASE)
                  opp = opp_match.group(1).strip() if opp_match else summary

                  date_val, time_val = parse_dt(dtstart)

                  games.append({
                      "date": date_val,
                      "time": time_val,
                      "type": game_type,
                      "code": code,
                      "opp": opp,
                      "location": location,
                      "summary": summary
                  })

              games.sort(key=lambda x: (x["date"], x["time"]))

              print(f"Total Matchups Detected: {len(games)}")
              print(f"Unique Bracket Code Formats: {sorted(list(bracket_codes))[:10]}")

              if games:
                  print(f"Date Coverage: {games[0]['date']} to {games[-1]['date']}\n")
                  print(f"{'Date':<11} | {'Time':<5} | {'Type':<5} | {'Code':<15} | {'Opponent':<25} | {'Location'}")
                  print("-" * 80)
                  for g in games[:12]:
                      print(f"{g['date']:<11} | {g['time']:<5} | {g['type']:<5} | {g['code'][:13]:<15} | {g['opp'][:23]:<25} | {g['location'][:20]}")
                  if len(games) > 12:
                      print(f"... and {len(games) - 12} more games")
          EOF
          python test_all_leagues.py
