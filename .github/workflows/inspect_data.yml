name: Inspect GameSheet Data

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Deep Diagnostic
        run: |
          cat << 'EOF' > deep_check.py
          import json
          import urllib.request
          from datetime import datetime
          from collections import Counter

          # 1. Analyze existing omha_raw_data.json
          with open("omha_raw_data.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          games = data.get("games", [])
          scheduled = [g for g in games if g.get("status") == "scheduled"]

          print("=" * 60)
          print(f"CURRENT DATASET: {len(games)} Total Games ({len(scheduled)} Scheduled)")
          print("=" * 60)

          # Show breakdown of scheduled game dates
          sched_dates = Counter(g.get("date") for g in scheduled)
          print("\n📅 Scheduled Games by Date:")
          for d, cnt in sorted(sched_dates.items()):
              print(f"   {d}: {cnt} games")

          # 2. Test Live GameSheet API for Season 15497 (Tri-County)
          print("\n" + "=" * 60)
          print("TESTING GAMESHEET API ENDPOINTS (Tri-County 15497)")
          print("=" * 60)

          headers = {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36',
              'Accept': 'application/json, text/plain, */*',
              'Referer': 'https://gamesheetstats.com/shares/dashboard',
              'Origin': 'https://gamesheetstats.com'
          }

          test_urls = [
              ("Raw unified-games", "https://gamesheetstats.com/api/unified-games/15497"),
              ("With limit=5000", "https://gamesheetstats.com/api/unified-games/15497?filter[limit]=5000"),
              ("Page 2 offset=100", "https://gamesheetstats.com/api/unified-games/15497?filter[offset]=100&filter[limit]=100"),
              ("Date from Nov 15", "https://gamesheetstats.com/api/unified-games/15497?filter[date_from]=2026-11-15"),
              ("Schedule endpoint", "https://gamesheetstats.com/api/schedule/15497?")
          ]

          for label, url in test_urls:
              try:
                  req = urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(req, timeout=15) as resp:
                      raw = json.loads(resp.read().decode('utf-8'))
                      items = raw if isinstance(raw, list) else (raw.get("games") or raw.get("data") or [])
                      print(f"✅ {label}: Status {resp.status} | Returned {len(items)} items")
              except Exception as e:
                  print(f"❌ {label}: {e}")

          EOF
          python deep_check.py
