name: Test Sim

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Ingest Full Season
        run: |
          python fetch_team_schedules.py

      - name: Run Season Simulation Engine
        run: |
          python simulate_season.py
