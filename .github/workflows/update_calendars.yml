name: Update Team Calendars

on:
  schedule:
    - cron: '0 8 * * *' # Runs daily at 8:00 AM UTC (4:00 AM EDT)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-calendars:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch Live Schedules
        run: python fetch_team_schedules.py

      - name: Commit and Push Future Games
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add future_games.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated schedule sync from team sites [skip ci]" && git push)
