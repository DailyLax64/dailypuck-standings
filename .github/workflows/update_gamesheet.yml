name: Update GameSheet League Data

on:
  schedule:
    # Runs daily at 06:00 UTC (2:00 AM EDT)
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-gamesheet:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run GameSheet Fetcher
        env:
          GAMESHEET_FIREBASE_KEY: ${{ secrets.GAMESHEET_FIREBASE_KEY }}
          GAMESHEET_EMAIL: ${{ secrets.GAMESHEET_EMAIL }}
          GAMESHEET_PASSWORD: ${{ secrets.GAMESHEET_PASSWORD }}
          GAMESHEET_AUTH: ${{ secrets.GAMESHEET_AUTH }}
          PYTHONUNBUFFERED: '1'
        run: |
          python fetch_omha_data.py

      - name: Commit and Push GameSheet Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add omha_raw_data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated daily GameSheet data update [skip ci]" && git push)
